[tool.poetry]
name = "openedx-platform-sdk"
version = "0.1.0"
description = "A client library for accessing Authoring API"
authors = []
readme = "README.md"
packages = [
    { include = "openedx_platform_sdk" },
]
include = ["openedx_platform_sdk/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.23.1,<0.29.0"
attrs = ">=22.2.0"

[tool.poetry.group.dev.dependencies]
openapi-python-client = ">=0.21.0"
pyyaml = ">=6.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
